<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Switch Checklist</title>
<style>
:root{--navy:#14263f;--green:#1c7a3d;--orange:#FF9900;--line:#e2e8f0;--muted:#5a6b80}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14263f;background:#f7f8fa;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 130px}
header{background:var(--navy);color:#fff;padding:26px 16px 22px;text-align:center}
header h1{margin:0 0 8px;font-size:1.5em;line-height:1.25}
header p{margin:0 auto;max-width:600px;color:#cfe0f0;font-size:.97em;line-height:1.5}
.tools{position:sticky;top:0;z-index:20;background:#f7f8fa;padding:12px 0 10px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:13px 14px;font-size:1em;border:2px solid var(--line);border-radius:9px;outline:none}
#q:focus{border-color:var(--green)}
.grp{background:#fff;border:1px solid var(--line);border-radius:11px;margin:14px 0;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:15px 17px;cursor:pointer;user-select:none}
.ghead:hover{background:#fafbfc}
.gt{flex:1}
.gt b{display:block;font-size:1.06em}
.gt span{color:var(--muted);font-size:.85em}
.gcount{background:#eef2f7;color:var(--navy);border-radius:20px;padding:3px 11px;font-size:.82em;font-weight:700;min-width:34px;text-align:center}
.gcount.on{background:var(--green);color:#fff}
.arw{color:var(--muted);transition:transform .18s}
.grp.open .arw{transform:rotate(180deg)}
.gbody{display:none;border-top:1px solid var(--line)}
.grp.open .gbody{display:block}
label.it{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid #f1f4f8;cursor:pointer}
label.it:last-child{border-bottom:0}
label.it:hover{background:#fafbfc}
label.it input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0;margin:0}
label.it.sel{background:#f2f9f4}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.07);padding:12px 16px;z-index:30}
.bin{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
.tally{flex:1;font-size:.95em}
.tally b{font-size:1.35em;display:block;line-height:1.15}
.tally span{color:var(--muted);font-size:.85em}
button.go{background:var(--orange);color:var(--navy);border:0;padding:15px 26px;border-radius:9px;font-size:1.03em;font-weight:800;cursor:pointer;white-space:nowrap}
button.go:disabled{background:#dfe4ea;color:#98a2b0;cursor:not-allowed}
.none{display:none;text-align:center;padding:26px;color:var(--muted)}
@media(max-width:560px){header h1{font-size:1.28em}.bin{gap:10px}button.go{padding:14px 18px;font-size:.97em}}
</style></head><body>
<header>
<h1>Check off every product you use,<br>even if you have a favourite brand.</h1>
<p>Every item you check is money you are handing to a big box conglomerate. Tick anything your household buys anywhere, then see your number.</p>
</header>
<div class="wrap">
<div class="tools"><input id="q" type="search" placeholder="Search for a product, try shampoo or laundry" autocomplete="off"></div>
<div id="list"></div>
<div class="none" id="none">Nothing matches that. Try a different word.</div>
</div>
<div class="bar"><div class="bin">
<div class="tally"><b id="n">0</b><span id="lab">items checked</span></div>
<button class="go" id="go" disabled>Check My Score</button>
</div></div>

var params=new URLSearchParams(location.search);
var CONTACT=params.get('contact_id')||params.get('contactId')||params.get('cid')||'';
var list=document.getElementById('list');
GROUPS.forEach(function(g,gi){
  var d=document.createElement('div'); d.className='grp'; d.dataset.g=gi;
  var items=g.items.map(function(it,ii){
    return '<label class="it" data-l="'+it.label.toLowerCase()+'"><input type="checkbox" data-g="'+gi+'" data-i="'+ii+'" data-p="'+it.points+'"><span>'+it.label+'</span></label>';
  }).join('');
  d.innerHTML='<div class="ghead"><div class="gt"><b>'+g.group+'</b><span>'+g.sub+'</span></div>'+
    '<div class="gcount" id="c'+gi+'">0</div><div class="arw">&#9662;</div></div><div class="gbody">'+items+'</div>';
  list.appendChild(d);
});
document.addEventListener('click',function(e){
  var h=e.target.closest('.ghead'); if(h) h.parentElement.classList.toggle('open');
});
function tally(){
  var boxes=[].slice.call(document.querySelectorAll('#list input:checked'));
  document.getElementById('n').textContent=boxes.length;
  document.getElementById('lab').textContent=boxes.length===1?'item checked':'items checked';
  document.getElementById('go').disabled=boxes.length===0;
  GROUPS.forEach(function(g,gi){
    var c=document.querySelectorAll('#list input[data-g="'+gi+'"]:checked').length;
    var el=document.getElementById('c'+gi); el.textContent=c; el.className='gcount'+(c?' on':'');
  });
}
document.addEventListener('change',function(e){
  if(e.target.type==='checkbox'){ e.target.closest('label').classList.toggle('sel',e.target.checked); tally(); }
});
document.getElementById('q').addEventListener('input',function(){
  var v=this.value.trim().toLowerCase(); var any=false;
  document.querySelectorAll('.grp').forEach(function(g){
    var shown=0;
    g.querySelectorAll('label.it').forEach(function(l){
      var m=!v||l.dataset.l.indexOf(v)>-1; l.style.display=m?'':'none'; if(m)shown++;
    });
    g.style.display=shown?'':'none'; if(shown)any=true;
    if(v&&shown)g.classList.add('open'); if(!v)g.classList.remove('open');
  });
  document.getElementById('none').style.display=any?'none':'block';
});
document.getElementById('go').addEventListener('click',function(){
  var picked=[],score=0;
  document.querySelectorAll('#list input:checked').forEach(function(b){
    var g=GROUPS[b.dataset.g], it=g.items[b.dataset.i];
    picked.push({group:g.group,label:it.label,points:it.points});
    score+=it.points;
  });
  sessionStorage.setItem('switchResult',JSON.stringify({score:score,count:picked.length,picked:picked,contact:CONTACT}));
  location.href='score.html'+(CONTACT?('?contact_id='+encodeURIComponent(CONTACT)):'');
});
tally();
</script></body></html>
