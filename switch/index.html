*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--navy);

.bin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px}
.tally{flex:1}
.tally b{font-size:2.1em;display:block;line-height:1;color:var(--navy)}
.tally span{color:var(--muted);font-size:.92em}

button.go:disabled{background:#e3e8ee;color:#9aa5b3;cursor:not-allowed}

function tally(){
  var b=document.querySelectorAll('#wrap input:checked');
  document.getElementById('n').textContent=b.length;
  document.getElementById('lab').textContent=b.length===1?'item checked':'items checked';
  document.getElementById('go').disabled=b.length===0;
}

  if(e.target.type==='checkbox'){e.target.closest('label').classList.toggle('sel',e.target.checked);tally();}
});
document.getElementById('go').addEventListener('click',function(){
  var picked=[],score=0;
  document.querySelectorAll('#wrap input:checked').forEach(function(b){
    var g=GROUPS[b.dataset.g],it=g.items[b.dataset.i];

    if(!g.unscored) score+=it.points;

});
