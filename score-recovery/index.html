<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your Home Audit — Switch to America</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf6ef;color:#1d2330;line-height:1.6;padding:20px}
.wrap{max-width:680px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08);margin-bottom:18px}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#c79a3b;margin-bottom:8px}
h1{font-size:26px;font-weight:800;color:#1c2a4a;margin-bottom:4px}
.zone-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:4px}
.zone-red{background:rgba(200,16,46,.12);color:#C8102E;border:1px solid rgba(200,16,46,.3)}
.zone-yellow{background:rgba(232,163,23,.12);color:#E8A317;border:1px solid rgba(232,163,23,.3)}
.zone-green{background:rgba(31,138,112,.12);color:#1F8A70;border:1px solid rgba(31,138,112,.3)}
.cta-btn{display:block;background:linear-gradient(180deg,#FF9900,#E47911);color:#fff;text-decoration:none;font-weight:900;padding:18px 24px;border-radius:14px;font-size:17px;text-align:center;box-shadow:0 8px 22px -6px rgba(228,121,17,.5);margin-top:8px}
.email-note{background:#e6f3fc;border:1.5px solid rgba(95,179,199,.4);border-radius:12px;padding:18px;font-size:14px;margin-top:4px}
.savings-big{font-size:36px;font-weight:900;color:#C8102E;text-align:center}
.no-data{text-align:center;padding:40px 20px;color:#5b6270}
img.shannon{width:80px;border-radius:50%;display:block;margin:12px auto 4px}

/* Collapsible product cards */
.prod-card{border-radius:12px;margin-bottom:0;cursor:pointer;transition:box-shadow .15s;-webkit-tap-highlight-color:transparent;}
.prod-card:nth-child(odd){background:#fff;}
.prod-card:nth-child(even){background:#faf6ef;}
.prod-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07);}
.prod-summary{padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.prod-brand{font-size:15px;font-weight:800;color:#C8102E;display:flex;align-items:center;gap:7px;}
.prod-hook{font-size:12.5px;color:#5b6270;line-height:1.4;}
.prod-swap{font-size:13px;font-weight:700;color:#1F8A70;}
.prod-toggle{font-size:11px;font-weight:700;color:rgba(11,37,69,.4);letter-spacing:.04em;margin-top:2px;display:flex;align-items:center;gap:4px;}
.prod-toggle::before{content:"▶";font-size:9px;transition:transform .2s;}
.prod-card.open .prod-toggle::before{transform:rotate(90deg);}
.prod-detail{display:none;padding:0 16px 14px;font-size:13.5px;color:#3a4a66;line-height:1.6;border-top:1px solid rgba(11,37,69,.08);}
.prod-card.open .prod-detail{display:block;}
.prod-detail p{margin-bottom:10px;}
.tonight{background:rgba(200,16,46,.06);border-left:3px solid #C8102E;border-radius:0 8px 8px 0;padding:8px 12px;font-size:12.5px;font-weight:700;color:#C8102E;margin-top:8px;}
.divider-band{background:linear-gradient(90deg,#0d1f3c,#1a3060);border-radius:10px;padding:10px 16px;margin:12px 0;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.prod-list-wrap{border-radius:14px;overflow:hidden;border:1px solid rgba(11,37,69,.1);}

/* $17 upsell card */
.upsell-card{background:linear-gradient(160deg,#0d2040,#071428);border-radius:20px;padding:0;overflow:hidden;margin-bottom:18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.4),0 0 0 1px rgba(255,153,0,.2);}
.upsell-header{background:linear-gradient(90deg,#E8A317,#C47F0D);padding:14px 22px;text-align:center;}
.upsell-header-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(11,37,69,.7);font-weight:800;margin-bottom:2px;}
.upsell-header-title{font-size:20px;font-weight:900;color:#0d1f3c;letter-spacing:.02em;}
.upsell-body{padding:24px 22px;}
.upsell-price{text-align:center;margin-bottom:20px;}
.upsell-price-num{font-size:72px;font-weight:900;line-height:1;color:#fff;letter-spacing:-.02em;}
.upsell-price-label{font-size:13px;color:rgba(255,255,255,.6);font-weight:600;margin-top:4px;}
.upsell-bullets{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.upsell-bullet{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:rgba(255,255,255,.9);line-height:1.45;}
.upsell-bullet-check{color:#E8A317;font-weight:900;font-size:16px;flex-shrink:0;margin-top:1px;}
.upsell-btn{display:block;background:linear-gradient(180deg,#E8A317,#C47F0D);color:#0d1f3c;text-decoration:none;font-weight:900;padding:18px 24px;border-radius:12px;font-size:16px;text-align:center;box-shadow:0 8px 22px -6px rgba(232,163,23,.5);cursor:pointer;border:none;width:100%;font-family:inherit;}
.upsell-sub{font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="report-loading" class="card" style="text-align:center;padding:40px">
    <div style="font-size:32px;margin-bottom:12px">⏳</div>
    <p style="color:#5b6270">Loading your home audit…</p>
  </div>
  <div id="report-content" style="display:none"></div>
  <div id="report-noscript" class="card no-data" style="display:none">
    <div style="font-size:48px;margin-bottom:16px">📬</div>
    <h2 style="margin-bottom:12px;color:#1c2a4a">Your audit is on its way.</h2>
    <p>It looks like you're opening this on a different device or browser.<br>Check your inbox — Shannon's sending your complete home audit by email.</p>
    <p style="margin-top:12px;font-size:13px;color:#888">If you don't see it within a few minutes, check your spam folder.</p>
  </div>
</div>

<script>
(function(){
  var BOOKING_URL = 'https://api.leadconnectorhq.com/widget/booking/kBsyKsW5kF1ZqiRxr4OC';
  // $17 3-Month Home Reset Stripe link — update when product is live in Stripe
  var RESET_STRIPE_URL = 'https://buy.stripe.com/PLACEHOLDER_17_RESET';

  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }

  function zoneBadge(score){
    if(score>=70) return '<span class="zone-badge zone-red">🔴 Red Zone</span>';
    if(score>=45) return '<span class="zone-badge zone-yellow">🟡 Caution Zone</span>';
    return '<span class="zone-badge zone-green">🟢 Clean Zone</span>';
  }

  // Build collapsible product card
  function prodCard(it, idx){
    var brandLabel = '🔴 ' + esc(it.brand);
    var swapLabel = it.target ? '✓ Swap → ' + esc(it.target) : '✓ Switch to America clean version';
    var hookText = it.detail ? esc(it.detail).substring(0,90)+'…' : '';
    var tonightAction = it.tonight || 'Check the label tonight. Swap this week.';
    return '<div class="prod-card" onclick="this.classList.toggle(\'open\')">'
      +'<div class="prod-summary">'
      +'<div class="prod-brand">'+brandLabel+'</div>'
      +(hookText ? '<div class="prod-hook">'+hookText+'</div>' : '')
      +'<div class="prod-swap">'+swapLabel+'</div>'
      +'<div class="prod-toggle">tap for full breakdown</div>'
      +'</div>'
      +'<div class="prod-detail">'
      +(it.detail ? '<p>'+esc(it.detail)+'</p>' : '')
      +'<div class="tonight">Tonight: '+esc(tonightAction)+'</div>'
      +'</div>'
      +'</div>';
  }

  var PHOTO_BASE = 'https://skubin53.github.io/sta-dashboard/now/';

  // Visual break image banner — rectangular so both subjects show
  function photoBanner(src, alt, caption, objectPos){
    objectPos = objectPos || 'center center';
    return '<div style="margin:16px 0;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1)">'
      +'<img src="'+src+'" alt="'+alt+'" style="width:100%;height:220px;object-fit:cover;object-position:'+objectPos+';display:block"/>'
      +(caption ? '<div style="background:#f5f1ea;padding:8px 14px;font-size:12px;font-style:italic;color:#6b5a3a;text-align:center">'+caption+'</div>' : '')
      +'</div>';
  }

  function buildProductList(items){
    if(!items.length) return '<p style="color:#5b6270;font-size:14px;padding:16px">Great news — no concerning brands detected in your scan.</p>';
    var html = '<div class="prod-list-wrap">';
    items.forEach(function(it, i){
      html += prodCard(it, i);
      // After item 4 (5th item): mom + baby visual break
      if(i === 4){
        html += '</div>'
          + photoBanner(
              PHOTO_BASE+'testimonial-mom-baby.jpg',
              'Mom holding her baby',
              '"The things I was putting on my newborn every night. Once I knew, I couldn\'t unknow it." — Sarah K.',
              'center 40%'  // shows mom\'s face AND baby — not just the top of frame
            )
          +'<div class="prod-list-wrap">';
      }
      // After item 9 (10th item): grandma + grandkids visual break
      if(i === 9){
        html += '</div>'
          + photoBanner(
              PHOTO_BASE+'testimonial-grandma-patio.jpg',
              'Grandmother with grandchildren',
              '"I made the switch for them. Cleanest table in the neighborhood." — Linda P., Grandmother',
              'center center'
            )
          +'<div class="prod-list-wrap">';
      }
      // Navy divider band every 5 items (after the photo breaks at 4 and 9)
      if(i > 0 && i % 5 === 0 && i !== 4 && i !== 9){
        var roomLabel = it.room ? it.room : 'Next room';
        html += '</div><div class="divider-band">'+esc(roomLabel)+'</div><div class="prod-list-wrap">';
      }
    });
    html += '</div>';
    return html;
  }

  function upsellCard(){
    return '<div class="upsell-card">'
      +'<div class="upsell-header">'
      +'<div class="upsell-header-kicker">Ready for the full reset?</div>'
      +'<div class="upsell-header-title">3-Month Home Reset Plan</div>'
      +'</div>'
      +'<div class="upsell-body">'
      +'<div class="upsell-price">'
      +'<div class="upsell-price-num">$17</div>'
      +'<div class="upsell-price-label">One-time. No subscription. Yours to keep.</div>'
      +'</div>'
      +'<div class="upsell-bullets">'
      +'<div class="upsell-bullet"><span class="upsell-bullet-check">✓</span><span>Week-by-week swap schedule — no overwhelm, one room at a time</span></div>'
      +'<div class="upsell-bullet"><span class="upsell-bullet-check">✓</span><span>Priority order: highest-harm products first, every time</span></div>'
      +'<div class="upsell-bullet"><span class="upsell-bullet-check">✓</span><span>Budget guide — how to swap without spending more than you do now</span></div>'
      +'<div class="upsell-bullet"><span class="upsell-bullet-check">✓</span><span>Month 3 check-in: rescan to measure how far you\'ve come</span></div>'
      +'</div>'
      +'<button class="upsell-btn" onclick="window.location.href=\''+RESET_STRIPE_URL+'\'">Get the 3-Month Reset — $17 →</button>'
      +'<div class="upsell-sub">Instant delivery. No subscription.</div>'
      +'</div>'
      +'</div>';
  }

  function renderReport(d){
    var firstName = d.firstName || 'there';
    var score = d.score || 0;
    var items = d.items || [];

    var html = '<div class="card">'
      +'<div class="kicker">Family Home Toxic Scorecard</div>'
      +'<h1>'+esc(firstName)+'\'s Home Audit</h1>'
      +'<p style="color:#5b6270;font-size:14px;margin-top:4px">Payment confirmed 💛 — your complete report is below.</p>'
      +'</div>'

      +'<div class="card" style="text-align:center">'
      +'<div class="kicker">Products Flagged in Your Home</div>'
      +'<div class="score-big">'+items.length+'</div>'
      +(items.length ? zoneBadge(score) : '<span style="font-size:14px;color:#1F8A70;font-weight:700">✓ Clean home</span>')
      +'</div>'

      // Product list card
      +'<div class="card" style="padding:20px 0">'
      +'<div style="padding:0 20px 14px"><div class="kicker">Your Switch List</div>'
      +'<p style="font-size:13px;color:#5b6270;margin-top:2px">Tap any product for the full breakdown and tonight\'s action.</p></div>'
      +buildProductList(items)
      +'</div>'

      // $17 upsell — appears right when the list feels overwhelming
      +upsellCard()

      // Booking CTA
      +'<div class="card">'
      +'<div class="kicker">Or talk it through</div>'
      +'<p style="margin-bottom:14px;font-size:16px;font-weight:700;color:#1c2a4a">Walk through your house with Shannon — free 15-minute phone audit.</p>'
      +'<p style="font-size:14px;color:#5b6270;margin-bottom:16px">Room by room, she answers questions, helps prioritize. No pitch.</p>'
      +'<a href="'+BOOKING_URL+'" class="cta-btn">📅 Book my free phone audit →</a>'
      +'</div>'

      +'<div class="card email-note">'
      +'<strong>📬 Check your email</strong><br>'
      +'Shannon is also sending your audit by email so you have a permanent copy. If you don\'t see it within a few minutes, check your spam folder.'
      +'</div>'

      // Founder byline
      +'<div class="card" style="text-align:center">'
      +'<img class="shannon" src="https://skubin53.github.io/sta-dashboard/cameron-chief-of-staff/funnel/shannon-photo.jpg" alt="Shannon Nicole">'
      +'<p style="font-size:14px;font-weight:700;color:#1c2a4a;margin-top:6px">Shannon Nicole</p>'
      +'<p style="font-size:12px;color:#aaa;margin-top:4px">Founder, Switch to America</p>'
      +'<p style="font-size:11px;color:#bbb;margin-top:8px">Order: Home Audit Report · $7 USD · Receipt sent by Stripe</p>'
      +'</div>';

    el('report-loading').style.display='none';
    el('report-content').innerHTML = html;
    el('report-content').style.display='block';
  }

  // ?maxdemo=1 — Shannon's iteration view. Shows every bad brand selected, max score.
  if(location.search.indexOf('maxdemo=1')>=0){
    renderReport({
      firstName:'Shannon',
      score:89,
      topRoom:'Laundry',
      items:[
        {brand:'Dawn Ultra Dish Soap', cat:'dish', target:"Lemon Brite (Switch to America)", room:'Kitchen',
         tonight:'Pull it out from under the sink tonight. Order Lemon Brite this week.',
         detail:"1,4-dioxane is on the EPA's likely-cause-cancer list. It hides inside the bottle as a manufacturing byproduct, so it never appears on the label. The MIT preservative is linked to thyroid problems, memory loss, and hormone disruption. Synthetic fragrance is a legal loophole hiding dozens of undisclosed chemicals."},
        {brand:'Cascade Pods', cat:'dishwasher', target:"Diamond Brite (Switch to America)", room:'Kitchen',
         tonight:'Check if you have a full box. Finish it, then switch. No reason to waste.',
         detail:"Contains chlorine compounds that off-gas during hot dishwasher cycles. Polyacrylate residue stays on the dishes your family eats from every meal."},
        {brand:'Lysol All-Purpose Spray', cat:'allpurpose', target:"Sol-U-Guard (Switch to America)", room:'Kitchen',
         tonight:'Wipe down the bottle label. Note the benzalkonium chloride — that\'s what makes it "kills 99.9%" and also what drives antibiotic resistance.',
         detail:"Benzalkonium chloride is linked to antibiotic resistance in peer-reviewed research. The synthetic fragrance contains phthalates — hormone disruptors that have been detected in children's urine."},
        {brand:'Vegetable / Canola Oil', cat:'oil', target:"Grass-fed beef tallow (single ingredient)", room:'Kitchen',
         tonight:'Look at the label. There is no ingredient other than beef fat. That\'s the point.',
         detail:"UC Davis lab testing found that 82% of \"pure\" avocado and vegetable oils on US shelves were rancid or cut with cheaper seed oils before the bottle was opened. Hexane — a federal hazardous air pollutant — is used to extract the oil. Every brand of bottled seed oil, including \"healthy\" olive and avocado, carries contamination and rancidity risk. Grass-fed beef tallow is a single ingredient with no extraction solvents, no adulteration, and a smoke point that handles real cooking temperatures."},
        {brand:'Avocado Oil (bottled)', cat:'oil', target:"Grass-fed beef tallow (Switch to America)", room:'Kitchen',
         tonight:'Check if your bottle says \"extra virgin\" — the FDA has no standard for that term on avocado oil. It means nothing.',
         detail:"UC Davis tested every avocado oil brand on US shelves in 2020. 82% were rancid or cut with soybean and sunflower oil before the bottle was even opened. The words \"pure\" and \"extra virgin\" have no legal definition for avocado oil. The rancid fat feeds inflammation in your body every time you cook."},
        {brand:'Tide', cat:'laundry', target:"MelaPower (Switch to America)", room:'Laundry',
         tonight:'Smell your laundry after it comes out. That \"clean\" scent is phthalates — they are releasing from the fibers onto your family\'s skin all day.',
         detail:"Contains 1,4-dioxane, classified by the EPA as a probable human carcinogen. Your family wears this residue against their skin all day."},
        {brand:'Bounce Dryer Sheets', cat:'dryer', target:"Wool dryer balls (Switch to America)", room:'Laundry',
         tonight:'Pull out the sheets. Quaternary ammonium compounds transfer directly onto clothing and absorb through skin with every wear.',
         detail:"Coated in quaternary ammonium compounds (quats) linked to asthma, reproductive harm, and antibiotic resistance. The fragrance chemicals release from clothing onto skin all day."},
        {brand:'Downy Fabric Softener', cat:'fabric', target:"MelaSoft (Switch to America)", room:'Laundry',
         tonight:'Skip it this load. Your clothes will still be soft — the dryer balls handle that.',
         detail:"Synthetic musk fragrances accumulate in human fat tissue and breast milk. The \"fresh laundry\" smell is phthalates releasing from your sheets all night."},
        {brand:'Clorox Bleach', cat:'bleach', target:"MelaBrite + Sol-U-Guard", room:'Laundry',
         tonight:'Check what you\'re mixing it with. Bleach + any other cleaner creates toxic gas.',
         detail:"Chlorine bleach fumes irritate the lungs and react with organic matter to form chloramines and trihalomethanes — both classified as carcinogens by the EPA."},
        {brand:'Pantene Shampoo', cat:'shampoo', target:"Affinia (Switch to America)", room:'Bathroom',
         tonight:'Read the ingredient list. Find methylparaben and propylparaben — those are the ones found in breast tumor tissue.',
         detail:"Contains parabens (methylparaben, propylparaben) that mimic estrogen and have been found in breast tumor tissue in peer-reviewed studies. Dimethicone builds up on the scalp and blocks follicles."},
        {brand:'Dove Body Wash', cat:'bodywash', target:"Gold Bar / Renew (Switch to America)", room:'Bathroom',
         tonight:'Check for PEG compounds on the label — those can be contaminated with 1,4-dioxane.',
         detail:"Contains parabens and PEGs contaminated with 1,4-dioxane. Parabens absorb through skin during every shower and have been detected in breast tissue."},
        {brand:'Secret Deodorant', cat:'deodorant', target:"Access Bar (Switch to America)", room:'Bathroom',
         tonight:'Apply to the inside of your wrist. That\'s how close it is to a lymph node when it\'s in your armpit.',
         detail:"Contains aluminum compounds applied daily to your armpit directly over lymph nodes. Aluminum accumulates in breast tissue. Also contains parabens and synthetic fragrance."},
        {brand:'Colgate Toothpaste', cat:'toothpaste', target:"Tooth Polish (Switch to America)", room:'Bathroom',
         tonight:'Brush without it once. Notice whether your mouth feels different — SLS strips the protective lining.',
         detail:"Sodium lauryl sulfate (SLS) strips the mouth's natural protective lining. Some formulas still contain triclosan, an antibiotic linked to hormone disruption, now banned in hand soap."},
        {brand:'Febreze Plug-In', cat:'air', target:"Pure essential oils + diffuser", room:'Home Air',
         tonight:'Unplug it. Put it in a bag. That\'s it.',
         detail:"Continuously releases benzene, formaldehyde, and phthalates into your home's air 24/7. A NIH study found plug-in air fresheners can raise VOC levels to match light cigarette smoke exposure — with no warning on the label."},
        {brand:'Yankee Candle (paraffin)', cat:'air', target:"Beeswax candles only", room:'Home Air',
         tonight:'Check the wax. If it doesn\'t say beeswax or soy, it\'s paraffin — a petroleum byproduct.',
         detail:"Paraffin wax is a petroleum byproduct. Burning it releases toluene and benzene — the same carcinogens in diesel exhaust. In an enclosed room, a single scented candle can match the air quality of sitting next to a smoker."},
      ]
    });
    return;
  }

  // Try to load from localStorage (same browser session as quiz)
  var scanData = null;
  try { scanData = JSON.parse(localStorage.getItem('sta_purchase_scan')||'null'); } catch(e){}

  if(scanData && scanData.savedAt){
    var age = (new Date() - new Date(scanData.savedAt)) / 1000 / 60;
    if(age > 120) scanData = null;
  }

  if(scanData){
    renderReport(scanData);
  } else {
    el('report-loading').style.display='none';
    el('report-noscript').style.display='block';
    var sid = (location.search.match(/session_id=([^&]+)/)||[])[1];
    if(sid){
      fetch('https://api.ismyhometoxic.com/score-recovery-thanks?session_id='+encodeURIComponent(sid)+'&format=json')
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if(d && d.sc) renderReport(d); })
        .catch(function(){});
    }
  }
})();
</script>
</body>
</html>
