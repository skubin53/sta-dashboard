<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch to America — Daily Dashboard</title>
<style>
  :root{
    --navy:#1c2a4a; --red:#b3343a; --cream:#faf6ef; --gold:#c79a3b;
    --ink:#1d2330; --soft:#6b7280; --card:#ffffff;
    --green:#2e9e5b; --yellow:#d9a300; --reddot:#cf3a3a; --blue:#3b76c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--cream);color:var(--ink);padding:18px;max-width:760px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  h1{font-size:20px;color:var(--navy);letter-spacing:-.3px}
  .updated{font-size:12px;color:var(--soft)}
  .tag{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:14px;letter-spacing:.4px}

  /* hero north star */
  .hero{background:linear-gradient(135deg,var(--navy),#26395f);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:14px;box-shadow:0 6px 20px rgba(28,42,74,.18)}
  .hero .lbl{font-size:13px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .hero .num{font-size:54px;font-weight:800;line-height:1.05;margin:2px 0}
  .hero .sub{font-size:13px;opacity:.8}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px}
  .card{background:var(--card);border-radius:14px;padding:15px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .card .num{font-size:32px;font-weight:800;color:var(--navy);line-height:1}
  .card .lbl{font-size:12.5px;color:var(--soft);font-weight:600;margin-top:4px}
  .card .sub{font-size:11px;color:var(--gold);font-weight:700;margin-top:3px}

  .section-t{font-size:13px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 9px}

  /* status pills */
  .status{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:flex;align-items:center;gap:7px;background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .green{background:var(--green)} .yellow{background:var(--yellow)} .reddot{background:var(--reddot)} .blue{background:var(--blue)}
  .pill .note{color:var(--soft);font-weight:500}

  /* top 5 */
  .todos{background:#fff;border-radius:14px;padding:6px 4px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .todo{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #f0ece3}
  .todo:last-child{border-bottom:none}
  .todo .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .todo .txt{font-size:14.5px;line-height:1.35}
  .todo .why{display:block;font-size:12px;color:var(--soft);margin-top:2px}
  .foot{text-align:center;font-size:11px;color:var(--soft);margin-top:18px;line-height:1.6}
  .err{background:#fff;border-radius:14px;padding:18px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
  <div class="head">
    <h1>☀️ Switch to America — Daily Dashboard</h1>
    <span class="updated" id="updated">loading…</span>
  </div>
  <span class="tag">NORTH STAR: BOOKED BUILDER ZOOMS</span>

  <div id="app"><div class="err">Loading your numbers…</div></div>

  <div class="foot">
    Cameron updates this every morning + on every real event.<br>
    Refresh anytime — it's always current.
  </div>

<script>
const $ = id => document.getElementById(id);
function dot(s){return s==='green'?'green':s==='yellow'?'yellow':s==='blue'?'blue':'reddot';}
async function load(){
  let d;
  try{
    const r = await fetch('https://api.ismyhometoxic.com/dashboard-data.json?t='+Date.now());
    d = await r.json();
  }catch(e){ $('app').innerHTML='<div class="err">Couldn\'t load data yet — check back after the morning run.</div>'; return; }
  $('updated').textContent = 'Updated '+(d.updated||'');
  const hero = d.hero||{};
  const m = d.metrics||[];
  const st = d.status||[];
  const t5 = d.top5||[];
  let html = '';
  html += `<div class="hero"><div class="lbl">${hero.label||'Booked Builder Zooms'}</div>`+
          `<div class="num">${hero.value!=null?hero.value:'—'}</div>`+
          `<div class="sub">${hero.sub||''}</div></div>`;
  html += '<div class="grid">';
  m.forEach(c=>{ html += `<div class="card"><div class="num">${c.value!=null?c.value:'—'}</div>`+
          `<div class="lbl">${c.label||''}</div>${c.sub?`<div class="sub">${c.sub}</div>`:''}</div>`; });
  html += '</div>';
  if(st.length){ html += '<div class="section-t">System Status</div><div class="status">';
    st.forEach(s=>{ html += `<span class="pill"><span class="dot ${dot(s.state)}"></span>${s.label} <span class="note">· ${s.note||''}</span></span>`; });
    html += '</div>'; }
  if(t5.length){ html += '<div class="section-t">🎯 Today\'s Top 5</div><div class="todos">';
    t5.forEach((t,i)=>{ const txt=typeof t==='string'?t:t.task; const why=typeof t==='object'?t.why:'';
      html += `<div class="todo"><div class="n">${i+1}</div><div class="txt">${txt}${why?`<span class="why">${why}</span>`:''}</div></div>`; });
    html += '</div>'; }
  $('app').innerHTML = html;
}
load();
setInterval(load, 120000); // auto-refresh every 2 min
</script>
</body>
</html>
